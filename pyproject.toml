[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "muget"
version = "0.0.2"
description = "YouTube Music downloader with tags embed"
readme = "README.md"
requires-python = ">=3.10"

authors = [
  { name = "meikoy-chan" }
]

license = "MIT"
license-files = ["LICENSE"]

keywords = [
  "ytmusicapi",
  "music",
  "yt-dlp",
  "music-downloader",
  "dowloader"
]

dependencies = [
  "click==8.4.2",
  "ytmusicapi==1.12.0",
  "yt-dlp==2026.7.4",
  "colorama"
]

[project.urls]
Homepage = "https://github.com/meikoy-chan/muget"
Repository = "https://github.com/meikoy-chan/muget"

[project.scripts]
muget = "muget.cli:main"